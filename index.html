<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>네베온라인 - NEVE ONLINE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Malgun Gothic', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a1c29 0%, #3b5998 50%, #dfe9f3 100%);
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* 천상계 배경 효과 (구름/빛) */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, rgba(0,0,0,0.5) 100%);
            pointer-events: none;
            z-index: 1;
        }

        header, main, .sidebar {
            position: relative;
            z-index: 2;
        }

        /* 상단 네비게이션바 */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .nav-links {
            display: flex;
            gap: 30px;
            list-style: none;
        }

        .nav-links a {
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: #ffd700;
            text-shadow: 0 0 8px #ffd700;
        }

        /* 햄버거 메뉴 버튼 */
        .menu-btn {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
        }

        /* 사이드바 */
        .sidebar {
            position: fixed;
            top: 0;
            right: -250px;
            width: 250px;
            height: 100%;
            background: rgba(20, 20, 30, 0.95);
            backdrop-filter: blur(15px);
            box-shadow: -5px 0 15px rgba(0,0,0,0.5);
            transition: 0.4s ease;
            padding-top: 80px;
            z-index: 10;
        }

        .sidebar.active {
            right: 0;
        }

        .sidebar ul {
            list-style: none;
            padding: 20px;
        }

        .sidebar ul li {
            margin-bottom: 20px;
        }

        .sidebar ul li a {
            color: #ddd;
            text-decoration: none;
            font-size: 16px;
            transition: 0.3s;
        }

        .sidebar ul li a:hover {
            color: #ffd700;
        }

        /* 메인 컨텐츠 영역 */
        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 60px 20px;
        }

        .hero-title {
            font-size: 42px;
            font-weight: bold;
            margin-bottom: 30px;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.6);
        }

        .btn-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 50px;
        }

        .btn {
            padding: 12px 25px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .btn-tutorial { background: rgba(255, 255, 255, 0.1); color: #fff; }
        .btn-copy { background: #ffd700; color: #1a1c29; }
        .btn-discord { background: #5865F2; color: #fff; }

        .btn:hover {
            transform: translateY(-3px);
            opacity: 0.9;
        }

        /* 서버 소개 카드 박스 */
        .info-card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 15px;
            padding: 30px;
            max-width: 600px;
            width: 100%;
            text-align: left;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        .info-card h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #ffd700;
        }

        .info-card p {
            margin-bottom: 12px;
            font-size: 16px;
        }

        .info-card a {
            color: #7289da;
            text-decoration: underline;
        }

        .dev-notice {
            margin-top: 20px;
            text-align: center;
            color: #ffadb0;
            font-style: italic;
        }
    </style>
</head>
<body>

    <!-- 상단 메뉴 -->
    <header>
        <div class="logo">NEVE ONLINE</div>
        <ul class="nav-links">
            <li><a href="#intro">서버소개</a></li>
            <li><a href="#background">서버배경</a></li>
            <li><a href="#guide">길라잡이</a></li>
            <li><a href="#donate">후원하러가기</a></li>
            <li><a href="#rules">법전</a></li>
        </ul>
        <button class="menu-btn" onclick="toggleSidebar()">ㅡ<br>ㅡ<br>ㅡ</button>
    </header>

    <!-- 사이드바 -->
    <div class="sidebar" id="sidebar">
        <ul>
            <li><a href="#hack-check">🛡️ 핵검사신청하기</a></li>
            <li><a href="#support">🎫 고객센터 / 문의</a></li>
            <li><a href="#ranking">🏆 서버 랭킹</a></li>
        </ul>
    </div>

    <!-- 메인 화면 -->
    <main>
        <h1 class="hero-title">[ 네베온라인에 당신을 초대합니다. ]</h1>

        <div class="btn-group">
            <a href="#tutorial" class="btn btn-tutorial">[튜토리얼 보러가기]</a>
            <a href="#" class="btn btn-copy" onclick="copyIP()">[서버주소 복사하러가기]</a>
            <a href="https://discord.gg/c3cWQPz4KY" target="_blank" class="btn btn-discord">[디스코드 들어가기]</a>
        </div>

        <!-- 서버 소개 박스 -->
        <div class="info-card" id="intro">
            <h2>✨ 서버 소개 ✨</h2>
            <p><strong>[네베온라인 당신을 초대합니다]</strong></p>
            <p><strong>버전 :</strong> 1.20.1</p>
            <p><strong>종목 :</strong> 인생약탈</p>
            <p><strong>디스코드링크 :</strong> <a href="https://discord.gg/c3cWQPz4KY" target="_blank">[클릭시 열리기]</a></p>
            <p class="dev-notice">나머지는 개발중입니다 기다려주세요!</p>
        </div>
    </main>

    <script>
        // 사이드바 토글 기능
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('active');
        }

        // 서버 주소 복사 기능 (서버 주소는 예시로 넣었습니다. 실제 주소로 변경하세요!)
        function copyIP() {
            const serverIP = "neve.labmc.kr"; // 실제 서버 주소로 수정하세요
            navigator.clipboard.writeText(serverIP).then(() => {
                alert("서버 주소가 복사되었습니다: " + serverIP);
            });
        }
    </script>
</body>
</html>
